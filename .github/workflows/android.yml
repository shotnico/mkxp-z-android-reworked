name: Android Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_NDK_VERSION: 23.2.8568313
      RUBY_VERSION: "3.1"

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Java (required by Gradle / Android SDK) ───────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. System dependencies ───────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake curl gpg xxd \
            ruby-full autoconf automake libtool pkg-config \
            python3 git unzip

      # ── 4. Ruby  ──────────────────────────────────────
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      # ── 5. Android SDK ────────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK ${{ env.ANDROID_NDK_VERSION }}
        run: |
          sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"

      # ── 6. Export toolchain paths ─────────────────────────────────────────────
      - name: Export NDK toolchain paths
        run: |
          ARCH=linux-x86_64
          NDK_PATH="$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/$ARCH/bin"
          echo "ANDROID_HOME=$ANDROID_HOME"           >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH"           >> "$GITHUB_ENV"
          echo "ARCH=$ARCH"                            >> "$GITHUB_ENV"
          echo "$TOOLCHAIN"                            >> "$GITHUB_PATH"

      # ── 7. Download JNI dependencies & Generate XXD ──────────────────────────
      - name: Download JNI dependencies (get_deps.sh)
        working-directory: app/jni
        run: |
          chmod +x get_deps.sh
          ./get_deps.sh
          cd mkxp-z
          chmod +x make_xxd.sh
          ./make_xxd.sh

      # ── 8. Compile native dependencies (arm64-v8a) ───────────────────────────
      - name: Compile native deps — arm64-v8a (64-bit)
        working-directory: app/jni
        run: |
          HOST=aarch64-linux-android \
          TARGET=aarch64-linux-android \
          ABI=arm64-v8a \
          LDFLAGS="-Wl,-z,max-page-size=16384" \
          make -j$(nproc)
          # Asegurar mapeo de carpetas por si acaso
          if [ -d "build-arm64-v8a" ] && [ ! -d "build-arm64" ]; then ln -s build-arm64-v8a build-arm64; fi

      # ── 9. Make Gradle wrapper executable ────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 10. Cache Gradle packages ─────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 11. Build release APK ─────────────────────────────────────────────────
      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.suppressUnsupportedCompileSdk=34 \
            --no-daemon \
            --stacktrace

      # ── 12. Sign APK (optional — uses secrets when available) ─────────────────
      - name: Sign APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS:       ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:    ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD:  ${{ secrets.STORE_PASSWORD }}
        run: |
          # Tollera spazi e ritorni a capo nel secret: una volta il contenuto e'
          # arrivato con la codifica alterata e base64 rispondeva solo
          # "invalid input", senza dire cosa fosse sbagliato.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > release.keystore
          if [ ! -s release.keystore ]; then
            echo "::error::KEYSTORE_BASE64 non e' base64 valido: keystore vuoto"
            exit 1
          fi
          echo "keystore decodificato: $(stat -c%s release.keystore) byte"
          # Selezione esplicita dell'ABI compilata (arm64-v8a): "head -1" su tutti
          # gli APK poteva pescarne uno senza librerie native -> crash all'avvio.
          APK=$(find app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::Nessun APK arm64-v8a trovato in app/build/outputs/apk/release"
            find app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi
          echo "APK selezionato: $APK"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out signed-release.apk \
            "$APK"
          echo "APK_PATH=signed-release.apk" >> "$GITHUB_ENV"

      # Senza secrets il workflow pubblicava un APK NON FIRMATO. Android rifiuta di
      # installare un APK privo di firma (INSTALL_PARSE_FAILED_NO_CERTIFICATES):
      # era quindi un artefatto inutilizzabile. Verificato sulla release v1.0.0:
      # nessun META-INF/*.RSA, nessun ".SF", nessun blocco "APK Sig Block 42".
      #
      # Qui generiamo una chiave usa-e-getta e firmiamo comunque, cosi' l'APK si
      # installa sempre. La chiave viene pubblicata come artifact: salvala e
      # caricala nei secrets (KEYSTORE_BASE64 / KEY_ALIAS / KEY_PASSWORD /
      # STORE_PASSWORD) per rendere stabile la firma. Con una firma che cambia a
      # ogni build, ogni aggiornamento richiede di disinstallare l'app prima --
      # e disinstallando si perdono i salvataggi sul telefono.
      - name: Sign APK with a throwaway key (no signing secrets)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Selezione esplicita dell'ABI compilata (arm64-v8a): "head -1" su tutti
          # gli APK poteva pescarne uno senza librerie native -> crash all'avvio.
          APK=$(find app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::Nessun APK arm64-v8a trovato in app/build/outputs/apk/release"
            find app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi
          echo "APK selezionato: $APK"

          keytool -genkeypair -v \
            -keystore throwaway.keystore \
            -alias fireash \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass fireash -keypass fireash \
            -dname "CN=Fire Ash ITA, OU=Sideload, O=Personal, C=IT"

          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner sign \
            --ks throwaway.keystore \
            --ks-key-alias fireash \
            --ks-pass "pass:fireash" \
            --key-pass "pass:fireash" \
            --out signed-release.apk \
            "$APK"

          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner verify \
            --verbose signed-release.apk

          base64 -w0 throwaway.keystore > throwaway.keystore.base64
          echo "APK_PATH=signed-release.apk" >> "$GITHUB_ENV"

      - name: Upload throwaway keystore (so the signature can be made stable)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        with:
          name: throwaway-keystore
          path: throwaway.keystore.base64
          retention-days: 90

      # Controllo finale: un APK senza firma non si installa, meglio far fallire
      # la build qui che scoprirlo sul telefono.
      - name: Verify the APK is signed
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner verify \
            "$APK_PATH" || {
              echo "::error::L'APK prodotto non e' firmato: Android rifiutera' di installarlo."
              exit 1
            }
          echo "Firma verificata su $APK_PATH"

      # ── 13. Upload APK as artifact (always) ───────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z-android-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

      # ── 14. Determine release tag ─────────────────────────────────────────────
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # ── 15. Create GitHub Release and upload APK ──────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "mkxp-z Android ${{ steps.tag.outputs.tag }}"
          body: |
            ## mkxp-z Android — ${{ steps.tag.outputs.tag }}

            Automated build from commit `${{ github.sha }}`.

            ### Installation
            1. Download the APK below and install it on your Android device.
            2. Create the `mkxp-z` folder in internal storage (`/storage/emulated/0/mkxp-z`).
            3. Copy your RPG Maker XP game files into that folder.
            4. Run mkxp-z, grant storage access, and enjoy!

            > **Note:** If the APK is unsigned, you may need to enable *Install unknown apps* in your device settings.
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
