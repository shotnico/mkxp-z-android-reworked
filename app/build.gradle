plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hatkid.mkxpz'
    compileSdk 33

    defaultConfig {
        // applicationId dedicato: identita' di installazione separata da quella di
        // mkxp-z generico, cosi' le due app possono convivere sul telefono.
        // "namespace" resta com.hatkid.mkxpz perche' e' il package Java delle classi.
        applicationId "it.placenti.fireash"
        minSdk 23
        targetSdk 33
        versionCode 1
        versionName "3.6.0"
        archivesBaseName = "FireAshITA-$versionName"
        ndk.debugSymbolLevel = 'FULL'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
            jniDebuggable true
        }
    }

    splits {
        abi {
            enable true
            reset()
            // Il workflow (.github/workflows/android.yml, step 8) compila le librerie
            // native SOLO per arm64-v8a. Tenere qui anche armeabi-v7a produceva un
            // secondo APK privo di libreria nativa, che va in crash all'avvio: e con
            // "find ... | head -1" nel workflow poteva benissimo essere QUELLO a
            // finire nella release. Elenchiamo solo cio' che viene davvero compilato.
            // arm64-v8a copre tutti i telefoni Android recenti.
            include 'arm64-v8a'
            universalApk false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "jni/Android.mk"
        }
    }
    ndkVersion '23.2.8568313'
}

dependencies {
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
}
